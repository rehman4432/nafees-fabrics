<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAFEES FABRICS INTERNATIONAL - ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}body{margin:0;background:#EEF2F7;color:#0F172A}
h1,h2,h3{font-family:'Poppins',sans-serif}
.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A1E36 0%,#1E3A5F 50%,#C9A227 130%);padding:16px}
.loginBox{background:#fff;width:100%;max-width:430px;border-radius:28px;padding:36px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.loginBox h1{font-size:27px;line-height:1.15;margin:12px 0 6px;letter-spacing:-.5px}.loginBox h1 span{color:#C9A227}
input,select{width:100%;padding:12px 13px;border:1.5px solid #E2E8F0;border-radius:12px;margin:6px 0;font-size:13px;outline:none;background:#F8FAFC}input:focus,select:focus{border-color:#0A1E36;background:#fff}
.btnD{background:#0A1E36;color:#fff;border:0;padding:13px 20px;border-radius:12px;font-weight:800;cursor:pointer}.btnG{background:linear-gradient(135deg,#C9A227,#E7C95A);color:#0A1E36;border:0;padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer}.btnL{background:#fff;border:1px solid #E2E8F0;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px}.btnW{background:#25D366;color:#fff;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:800;font-size:12px}
.app{display:flex}.side{width:272px;background:linear-gradient(180deg,#0A1E36,#0F2A4A);color:#fff;min-height:100vh;padding:22px;position:sticky;top:0;flex-shrink:0}.side h2{margin:0;font-size:18px;line-height:1.3}.side h2 span{color:#C9A227}
.menu button{display:flex;gap:10px;width:100%;text-align:left;background:transparent;color:#CBD5E1;border:0;padding:12px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:3px}.menu button:hover{background:rgba(255,255,255,.08)}.menu button.active{background:linear-gradient(135deg,#C9A227,#E7C95A);color:#0A1E36;font-weight:800;box-shadow:0 6px 18px rgba(201,162,39,.35)}
.main{flex:1;padding:20px;max-width:1480px}.top{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.top h1{margin:0;font-size:22px;letter-spacing:-.5px}.top p{margin:2px 0 0;color:#64748B;font-size:12px}
.kpiRow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:20px;position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.04)}.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#0A1E36)}.kpi label{font-size:11px;color:#64748B;font-weight:800;letter-spacing:.7px}.kpi b{display:block;font-size:24px;margin-top:7px;letter-spacing:-.6px;font-family:'Poppins'}.kpi p{margin:7px 0 0;color:#64748B;font-size:12px}.kpi .pct{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#DCFCE7;color:#166534;display:inline-block;margin-top:8px}
.chartRow{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.chartBox{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.chartBox h3{margin:0;font-size:16px}.chartBox p{margin:4px 0 0;color:#64748B;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:20px;height:180px;margin-top:20px;border-bottom:1px solid #E2E8F0;padding:0 8px}.barWrap{flex:1;text-align:center}.bar{margin:0 auto;border-radius:10px 10px 0 0;width:100%;max-width:48px;min-height:10px}.barWrap span{font-size:11px;font-weight:700;color:#334155;display:block;margin-top:9px;line-height:1.35}
.donut{width:160px;height:160px;border-radius:50%;margin:20px auto 0;position:relative;display:flex;align-items:center;justify-content:center;background:conic-gradient(#0A1E36 0 38%,#C9A227 38% 62%,#22C55E 62% 82%,#E2E8F0 82% 100%);box-shadow:0 8px 20px rgba(0,0,0,.08)}.donut::after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%}.donut b{position:relative;z-index:1;font-size:21px;font-family:'Poppins'}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}.legend span{font-size:11px;font-weight:700;display:flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.box{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.box h3{margin:0;font-size:15px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:11px;font-weight:700;color:#334155}
table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#0A1E36;color:#fff;padding:12px;text-align:left;font-size:11px;white-space:nowrap}td{padding:12px;border-bottom:1px solid #F1F5F9;font-size:13px;white-space:nowrap}.hidden{display:none}
.badgeP{background:#FEF9C3;color:#854D0E;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}.badgeA{background:#DCFCE7;color:#166534;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}.badgeR{background:#FEE2E2;color:#991B1B;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.tabBtn{padding:10px 18px;border:1px solid #E2E8F0;background:#fff;border-radius:12px;font-weight:800;cursor:pointer}.tabBtn.active{background:#0A1E36;color:#fff}
.subTab{padding:10px 16px;border:1px solid #E2E8F0;background:#fff;border-radius:999px;font-weight:800;cursor:pointer;font-size:13px}.subTab.active{background:#C9A227;color:#0A1E36;border-color:#C9A227}
.remind{background:#FEF2F2;border:1px solid #FECACA;border-radius:20px;padding:16px;margin-top:14px}.remind h3{margin:0;color:#991B1B}
.att{width:32px;text-align:center;cursor:pointer;font-weight:800;border-radius:6px}.att.P{background:#DCFCE7}.att.A{background:#FEE2E2}.att.H{background:#FEF9C3}.att.L{background:#E0E7FF}
@media(max-width:900px){.side{display:none}.kpiRow,.grid4,.chartRow{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}.no-print{display:none!important}}
</style></head><body>
<div id="loginScreen" class="loginWrap"><div class="loginBox"><div style="width:68px;height:68px;background:#0A1E36;color:#C9A227;display:flex;align-items:center;justify-content:center;border-radius:20px;margin:0 auto;font-size:32px;font-weight:900;font-family:Poppins">N</div><h1>NAFEES FABRICS<br><span>INTERNATIONAL</span></h1><p style="color:#64748B;font-size:13px;margin:0 0 16px">ERP SYSTEM - FAISALABAD</p><input id="uName" placeholder="Username"><input id="uPass" type="password" placeholder="Password"><button class="btnD" onclick="doLogin()" style="width:100%">LOGIN</button><button onclick="resetLogin()" style="width:100%;margin-top:8px;background:#FEE2E2;border:1px solid #FECACA;padding:11px;border-radius:12px;font-weight:800;cursor:pointer">RESET LOGIN</button><p id="loginErr" style="color:#DC2626;font-weight:700"></p><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:12px;text-align:left;font-size:12px;line-height:1.7"><b>DEFAULT LOGIN</b><br>ADMIN - admin / Admin@123<br>BOSS - boss / Boss@123<br>MANAGER - manager / Manager@123</div></div></div>
<div id="appScreen" class="app hidden"><div class="side no-print"><h2>NAFEES FABRICS<br><span>INTERNATIONAL</span></h2><p style="font-size:11px;color:#94A3B8" id="whoInfo"></p><div class="menu" id="menu"></div><button class="btnG" onclick="exportBackup()" style="width:100%">DOWNLOAD BACKUP</button><button class="btnL" onclick="document.getElementById('importFile').click()" style="width:100%;margin-top:8px">RESTORE BACKUP</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)"><button class="btnG" style="width:100%;margin-top:14px" onclick="logout()">LOGOUT</button></div>
<div class="main"><div id="printArea"><div class="top"><div><h1 id="pageTitle">DASHBOARD</h1><p>NAFEES FABRICS INTERNATIONAL - ERP</p></div><div class="no-print"><button class="btnG" onclick="window.print()">PRINT / PDF</button></div></div><div id="content"></div></div></div></div>
<script>
let DEFAULT_USERS={boss:{pass:"Boss@123",role:"BOSS",name:"BOSS",access:"ALL"},admin:{pass:"Admin@123",role:"ADMIN",name:"ADMIN",access:"ALL"},manager:{pass:"Manager@123",role:"MANAGER",name:"MANAGER",access:"ALL"}};
let USERS;try{USERS=JSON.parse(localStorage.getItem("nafees_users")||"null")||DEFAULT_USERS}catch(e){USERS=DEFAULT_USERS} USERS.admin=DEFAULT_USERS.admin;USERS.boss=DEFAULT_USERS.boss;USERS.manager=DEFAULT_USERS.manager;
function saveUsers(){try{localStorage.setItem("nafees_users",JSON.stringify(USERS))}catch(e){}}
function resetLogin(){try{localStorage.removeItem("nafees_users")}catch(e){} USERS=JSON.parse(JSON.stringify(DEFAULT_USERS));saveUsers();document.getElementById("uName").value="admin";document.getElementById("uPass").value="Admin@123";alert("Reset Done.")}
function doLogin(){let u=document.getElementById("uName").value.trim().toLowerCase(),p=document.getElementById("uPass").value.trim();if((USERS[u]&&USERS[u].pass===p)||(DEFAULT_USERS[u]&&DEFAULT_USERS[u].pass===p)){let f=USERS[u]||DEFAULT_USERS[u];currentUser={user:u,role:f.role,name:f.name,access:f.access||"ALL"};try{localStorage.setItem("nafees_session",JSON.stringify(currentUser))}catch(e){} showApp();}else{document.getElementById("loginErr").innerText="Invalid Username Or Password";}}
let ALL_PAGES=["Dashboard","Yarn Purchase","Yarn Stock","Sizing","Beams","Dyeing","Grey Stock","Ready Stock","Shop Ready Stock","Meter Reading","Ledger","Salary","Contract","Shopify","User Management"];
let TABS={"Yarn Purchase":["ALL","PO CREATED","GRN DONE","BILL RECEIVED","COMPLETED"],"Yarn Stock":["ALL","YARN","COTTON","POLYESTER"],"Sizing":["ALL","SIZING","BEAM READY"],"Beams":["ALL","READY","ON LOOM","EMPTY"],"Dyeing":["ALL","DYEING","FINISHED","PENDING"],"Grey Stock":["ALL","GREY","REJECTED","CHECKED"],"Ready Stock":["ALL","THAAN","SUIT","T.P SUIT","B GRADE","CUT PIECE","CUTTING"],"Shop Ready Stock":["ALL","THAAN","SUIT","T.P SUIT","B GRADE","CUT PIECE","CUTTING"],"Meter Reading":["ALL","FACTORY","COLONY"],"Contract":["ALL","WEAVER","SIZING","DYEING"],"Shopify":["ALL","NEW ORDER","SHIPPED","DELIVERED","RETURN"]};
let currentUser=null;try{currentUser=JSON.parse(localStorage.getItem("nafees_session")||"null")}catch(e){} let cur="Dashboard";let DB={};
function loadDB(){let keys=["nafees_cloud_v12","nafees_full_v12","nafees_full_v12_backup1"];for(let k of keys){try{let v=JSON.parse(localStorage.getItem(k)||"{}");if(v&&Object.keys(v).length){DB=v;return}}catch(e){}}DB={}} loadDB();
ALL_PAGES.forEach(p=>{if(!DB[p])DB[p]=[]}); if(!DB._meta)DB._meta={}; if(!DB._tabs)DB._tabs={};
function getTab(page){ if(DB._tabs[page]) return DB._tabs[page]; if(TABS[page]) return TABS[page][0]; return "ALL"; }
function setTab(page,tab){ try{DB._tabs[page]=tab; saveDB(); renderPage();}catch(e){} }
function tabBar(page){ if(!TABS[page]) return ""; let ct=getTab(page); let h='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" class="no-print">'; for(let i=0;i<TABS[page].length;i++){ let t=TABS[page][i]; h+='<button class="subTab '+(t===ct?"active":"")+'" onclick="setTab(\''+page+'\',\''+t+'\')">'+t+'</button>'; } h+='</div>'; return h; }
function matchesTab(row,page,ct){ if(ct==="ALL") return true; let v=(row.cat||row.status||row.type||"").toUpperCase(); return v===ct.toUpperCase(); }
function saveDB(){try{DB._meta.lastSync=new Date().toISOString();let s=JSON.stringify(DB);localStorage.setItem("nafees_cloud_v12",s);localStorage.setItem("nafees_full_v12",s);localStorage.setItem("nafees_full_v12_backup1",s);}catch(e){}}}
function exportBackup(){try{let blob=new Blob([JSON.stringify({users:USERS,db:DB,exported:new Date().toISOString()},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="NAFEES-FABRICS-BACKUP-"+new Date().toISOString().slice(0,10)+".json";a.click();}catch(e){}}
function importBackup(e){let f=e.target.files[0];let r=new FileReader();r.onload=function(){try{let d=JSON.parse(r.result);DB=d.db||d;if(d.users)USERS=d.users;saveUsers();saveDB();renderPage();alert("Backup Restored.");}catch(err){alert("Invalid Backup")}};r.readAsText(f);}
function logout(){try{saveDB();localStorage.removeItem("nafees_session")}catch(e){} currentUser=null;document.getElementById("loginScreen").classList.remove("hidden");document.getElementById("appScreen").classList.add("hidden");}
function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appScreen").classList.remove("hidden");document.getElementById("whoInfo").innerText=currentUser.name+" - "+currentUser.role+" - "+new Date().toISOString().slice(0,10);renderMenu();renderPage();}
function hasAccess(p){if(currentUser.role==="ADMIN"||currentUser.role==="BOSS")return true;if(currentUser.access==="ALL")return true;return (currentUser.access||[]).includes(p)}
function canEntry(){return currentUser.role!=="BOSS"} function canDelete(){return currentUser.role==="ADMIN"} function canApprove(){return currentUser.role==="BOSS"||currentUser.role==="ADMIN"}
function renderMenu(){document.getElementById("menu").innerHTML=ALL_PAGES.filter(p=>p==="Dashboard"||hasAccess(p)).map(p=>`<button class="${p===cur?'active':''}" onclick="go('${p}')">${p}</button>`).join("")}
function go(p){if(!hasAccess(p)&&p!=="Dashboard"){alert("No Access");return} cur=p;renderMenu();renderPage()}
function fmt(n){return Number(n||0).toLocaleString()} function today(){return new Date().toISOString().slice(0,10)} function fmtDate(d){if(!d)return "";let p=d.split("-");return p[2]+"-"+p[1]+"-"+p[0]}
function del(page,idx){if(!canDelete())return alert("Only Admin Can Delete");if(!confirm("Delete?"))return;DB[page].splice(idx,1);saveDB();renderPage()}
function approve(page,idx){if(!canApprove())return alert("Only Boss / Admin");DB[page][idx].appr="APPROVED";saveDB();renderPage()}
function reject(page,idx){if(!canApprove())return alert("Only Boss / Admin");DB[page][idx].appr="REJECTED";saveDB();renderPage()}
function apprBadge(r){if(r==="APPROVED")return '<span class="badgeA">APPROVED</span>';if(r==="REJECTED")return '<span class="badgeR">REJECTED</span>';return '<span class="badgeP">PENDING</span>'}
function actionBtns(page,idx){let h="";if(canApprove())h+=`<button class="btnL" onclick="approve('${page}',${idx})">Approve</button> <button class="btnL" onclick="reject('${page}',${idx})">Reject</button> `;if(canDelete())h+=`<button class="btnL" onclick="del('${page}',${idx})">Delete</button>`;return h||'VIEW ONLY'}
function getAllParties(){let s=new Set();try{(DB["Ledger"]||[]).forEach(r=>{if(r.party)s.add(r.party)});(DB["Yarn Purchase"]||[]).forEach(r=>{if(r.party)s.add(r.party)})}catch(e){} return [...s].sort()}
function partyOptions(){return getAllParties().map(p=>`<option value="${p}">`).join("")}
function getAllQualities(){let s=new Set();try{ALL_PAGES.forEach(p=>{(DB[p]||[]).forEach(r=>{if(r.quality)s.add(r.quality); if(r.name)s.add(r.name)} )})}catch(e){} return [...s].sort()}
function qualityOptions(){return getAllQualities().map(q=>`<option value="${q}">`).join("")}
function getAllNames(page){let s=new Set();try{(DB[page]||[]).forEach(r=>{if(r.name)s.add(r.name); if(r.quality)s.add(r.quality)})}catch(e){} return [...s].sort()}
function nameOptions(page){return getAllNames(page).map(n=>`<option value="${n}">`).join("")}
function cleanPhone(p){return (p||"").replace(/[^0-9]/g,"")} function toWhatsAppPhone(p){let d=cleanPhone(p);if(d.startsWith("0"))d="92"+d.slice(1);if(d.length===10)d="92"+d;return d}
function sendWhatsAppReminder(party,phone,amount,due,bill,refNo,payMode){let msg=`Dear ${party},\n\nReminder from NAFEES FABRICS INTERNATIONAL.\n\nYour payment of Rs ${fmt(amount)} for Bill No ${bill||"-"} (${payMode||""} Ref: ${refNo||"-"}) is due on ${fmtDate(due)}.\n\nKindly make your payment today.\n\nThank you.\n\nNAFEES FABRICS INTERNATIONAL\nFaisalabad`;let ph=toWhatsAppPhone(phone);if(!ph){alert("Party Phone Not Found.");return} window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(msg),"_blank")}
function getDueReminders(){let t=today();try{return DB["Ledger"].map((r,i)=>({...r,_idx:i})).filter(r=>r.appr!=="REJECTED"&&r.due&&r.due<=t&&(r.credit-r.debit>0))}catch(e){return []}}
function onPayModeChange(){let m=document.getElementById("lMode").value;document.getElementById("cashBox").style.display=m==="CASH"?"block":"none";document.getElementById("chequeBox").style.display=m==="CHEQUE"?"block":"none";document.getElementById("onlineBox").style.display=m==="ONLINE"?"block":"none";}
function setLedgerTab(t){ window.ledgerTab=t; renderPage(); }
function setLedgerParty(v){ window.ledgerParty=v; renderPage(); }
function renderPage(){
document.getElementById("pageTitle").innerText=cur.toUpperCase();let c=document.getElementById("content");
if(cur==="Dashboard"){
let pur=0,paid=0;try{pur=DB["Yarn Purchase"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.total,0);paid=DB["Yarn Purchase"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.paid,0)}catch(e){}
let grey=0,ready=0,shop=0,yarnSt=0,meterTotal=0,meterPaid=0;try{grey=DB["Grey Stock"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.balance,0);ready=DB["Ready Stock"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.balance,0);shop=DB["Shop Ready Stock"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.balance,0);yarnSt=DB["Yarn Stock"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+b.balance,0);meterTotal=DB["Meter Reading"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+(b.total||0),0);meterPaid=DB["Meter Reading"].filter(x=>x.appr!=="REJECTED").reduce((a,b)=>a+(b.paid||0),0)}catch(e){}
let dues=getDueReminders();
let payPct=pur?Math.round(paid/pur*100):0;
let prodTotal=grey+ready+shop+yarnSt||1;
c.innerHTML=`${dues.length?`<div class="remind"><h3>PAYMENT REMINDERS - ${dues.length} DUE TODAY / OVERDUE</h3>${dues.slice(0,6).map(r=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #FECACA;flex-wrap:wrap;gap:8px"><span><b>${r.party}</b> - Bill ${r.bill} - ${r.payMode} ${r.refNo||""} - Rs ${fmt(r.credit-r.debit)} - Due ${fmtDate(r.due)}</span><button class="btnW" onclick="sendWhatsAppReminder('${r.party}','${r.phone||""}',${r.credit-r.debit},'${r.due}','${r.bill}','${r.refNo||""}','${r.payMode||""}')">SEND WHATSAPP</button></div>`).join("")}</div>`:""}
<div class="kpiRow"><div class="kpi" style="--c:#0A1E36"><label>TOTAL MANUFACTURING COST</label><b>Rs ${fmt(pur)}</b><p>Paid Rs ${fmt(paid)} | Remaining Rs ${fmt(pur-paid)}</p><span class="pct">${payPct}% PAID</span></div><div class="kpi" style="--c:#C9A227"><label>YARN STOCK</label><b>${fmt(yarnSt)} Bags</b><p>Opening + Received - Used</p></div><div class="kpi" style="--c:#22C55E"><label>GREY STOCK</label><b>${fmt(grey)}</b><p>Production - Sale</p></div><div class="kpi" style="--c:#8B5CF6"><label>READY + SHOP STOCK</label><b>${fmt(ready+shop)}</b><p>Ready ${fmt(ready)} | Shop ${fmt(shop)}</p></div></div>
<div class="chartRow"><div class="chartBox"><h3>Manufacturing Cost Overview</h3><p>Purchase vs Paid vs Remaining</p><div class="bars"><div class="barWrap"><div class="bar" style="height:${pur?100:8}px;background:linear-gradient(180deg,#0A1E36,#4A7AB5)"></div><span>PURCHASE<br>Rs ${fmt(pur)}</span></div><div class="barWrap"><div class="bar" style="height:${pur?Math.max(12,paid/pur*100):8}px;background:linear-gradient(180deg,#22C55E,#86EFAC)"></div><span>PAID<br>Rs ${fmt(paid)}</span></div><div class="barWrap"><div class="bar" style="height:${pur?Math.max(12,(pur-paid)/pur*100):8}px;background:linear-gradient(180deg,#C9A227,#FDE68A)"></div><span>REMAINING<br>Rs ${fmt(pur-paid)}</span></div><div class="barWrap"><div class="bar" style="height:${meterTotal?Math.max(12,meterTotal/(pur||1)*100):8}px;background:linear-gradient(180deg,#8B5CF6,#C4B5FD)"></div><span>METER BILL<br>Rs ${fmt(meterTotal)}</span></div></div></div><div class="chartBox"><h3>Production Distribution</h3><p>Stock Share</p><div class="donut"><b>${fmt(prodTotal)}</b></div><div class="legend"><span><i class="dot" style="background:#0A1E36"></i>GREY ${fmt(grey)}</span><span><i class="dot" style="background:#C9A227"></i>READY ${fmt(ready)}</span><span><i class="dot" style="background:#22C55E"></i>SHOP ${fmt(shop)}</span><span><i class="dot" style="background:#E2E8F0"></i>YARN ${fmt(yarnSt)}</span></div></div></div>

window.saveLedger=function(){ try{let p=document.getElementById("l2").value.toUpperCase().trim(); if(!p) return alert("Party Required"); let mode=document.getElementById("lMode").value; let refNo=""; let cashBy=document.getElementById("lCashBy").value.toUpperCase().trim(); let chequeStatus=document.getElementById("lChequeStatus")?document.getElementById("lChequeStatus").value:""; if(mode==="CASH"){ if(!cashBy) return alert("Cash Received By Required"); refNo="CASH"; } if(mode==="CHEQUE"){ refNo=document.getElementById("lCheque").value.toUpperCase().trim(); if(!refNo) return alert("Cheque No Required"); } if(mode==="ONLINE"){ refNo=document.getElementById("lTid").value.toUpperCase().trim(); if(!refNo) return alert("TID Required"); } DB["Ledger"].unshift({date:document.getElementById("l1").value,party:p,phone:document.getElementById("lPhone").value.trim(),bill:document.getElementById("l3").value.toUpperCase(),payMode:mode,refNo:refNo,chequeStatus:chequeStatus,cashBy:cashBy,type:document.getElementById("l4").value,debit:+document.getElementById("l5").value||0,credit:+document.getElementById("l6").value||0,due:document.getElementById("l7").value,remDate:document.getElementById("lRem").value,details:document.getElementById("l8").value.toUpperCase(),appr:"PENDING"}); saveDB(); renderPage();}catch(e){alert("Error - Data Not Lost.")} };

window.saveWorker=function(){ try{let n=document.getElementById("w1").value.toUpperCase().trim(); let s=+document.getElementById("w3").value||0; if(!n||!s) return alert("Name And Salary Required"); let att={}; for(let i=1;i<=31;i++) att[i]="P"; let div=+document.getElementById("w4").value||30; let adv=+document.getElementById("w5").value||0; let extra=+document.getElementById("wExtra").value||0; let dc=DB._meta.salaryDays||30; DB["Salary"].unshift({name:n,desig:document.getElementById("w2").value.toUpperCase()||"WEAVER",salary:s,div:div,adv:adv,extra:extra,att:att,present:dc,payable:Math.round(s/div*(dc+extra)-adv),appr:"PENDING"}); saveDB(); renderPage();}catch(e){alert("Error - Data Not Lost.")} };
window.toggleAtt=function(idx,day){ try{let r=DB["Salary"][idx]; if(!r.att) r.att={}; let curV=r.att[day]||"P"; let nxt=curV==="P"?"A":curV==="A"?"H":curV==="H"?"L":"P"; r.att[day]=nxt; let pres=0; let dc=DB._meta.salaryDays||30; for(let i=1;i<=dc;i++){ let v=r.att[i]||"P"; if(v==="P") pres+=1; else if(v==="H") pres+=0.5; } r.present=pres; r.payable=Math.round(r.salary/r.div*(pres+(r.extra||0))-r.adv); saveDB(); renderPage();}catch(e){} };
